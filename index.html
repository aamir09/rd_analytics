<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/rd_analytics/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red Devils Analytics — Manchester United Stats</title>
    <meta name="description" content="Modern Manchester United analytics platform with player statistics, league table, fixtures, results and team insights. Updated daily." />
    <meta name="theme-color" content="#8B0000" />
    <meta property="og:title" content="Red Devils Analytics" />
    <meta property="og:description" content="Deep statistics and insights for Manchester United." />
    <meta property="og:type" content="website" />
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
      // Also handle the query-string style redirect from 404.html
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
