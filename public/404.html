<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Red Devils Analytics — Redirecting…</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Converts the path into a query-string so index.html can restore it.
      // Based on https://github.com/rafgraph/spa-github-pages
      (function () {
        // segmentCount = 1 because the repo is served from /rd_analytics.github.io/
        var segmentCount = 1;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body>
    Redirecting&hellip;
  </body>
</html>
